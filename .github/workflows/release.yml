name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create source archive
        run: zip -r reactopus-source.zip . -x "node_modules/*" ".git/*" ".github/*" "*.min.js"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            reactopus.min.js
            reactopus-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
