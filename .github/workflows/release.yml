name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "reactopus.min.js"
          tag: latest
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
